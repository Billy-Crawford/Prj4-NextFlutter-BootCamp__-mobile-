name: CI / Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-ci:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🌐 Generate Localization files
        run: flutter gen-l10n

      - name: 🔍 Static Analysis (flutter analyze)
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test test/news_repository_test.dart test/unit_tests.dart test/widget_test.dart

      - name: 📱 Build Android APK (Release Preview)
        run: flutter build apk --debug
